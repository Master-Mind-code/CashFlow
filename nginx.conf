server {
    listen 80;
    server_name localhost;

    # Répertoire racine contenant les fichiers statiques générés par Vite
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Compression Gzip pour de meilleures performances
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Gestion des routes de l'application React (SPA)
    # Si le fichier ou dossier demandé n'existe pas, rediriger vers index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Mise en cache optimale des assets statiques (JS, CSS, images, polices)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # Page d'erreur personnalisée
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
